[package]
name = "funwordl"
version = "0.1.1"
edition = "2024"
# Oldest toolchain that builds this; the `msrv` CI job keeps it true.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/anwarahmed/funwordl"
description = "A playful Wordle-style word game for the terminal, made for children"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ratatui = "0.30.2"
# The rules, the word lists and their definitions, the saved files and the updater are
# wordl's library. Raise `rev` to take a fix made there.
wordl = { git = "https://github.com/anwarahmed/wordl", rev = "9aed85ea455098a5c2a884e44de0b31972b80f88" }

[profile.release]
lto = true
# Keep symbol names so a panic in the field has a readable backtrace.
strip = "debuginfo"
